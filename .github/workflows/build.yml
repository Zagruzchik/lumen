name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish result to ci-out branch
        if: always()
        run: |
          mkdir -p out
          grep -E "^e: |error:|FAILURE|What went wrong|BUILD SUCCESSFUL|BUILD FAILED|Unresolved|Could not" build.log > out/errors.txt || true
          tail -n 400 build.log > out/build-tail.log || true
          cp app/build/outputs/apk/release/*.apk out/lumen.apk 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > out/status.txt
          cd out
          git init -q
          git checkout -q -b ci-out
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-out

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lumen-apk
          path: app/build/outputs/apk/release/*.apk
