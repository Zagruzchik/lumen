name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish result to ci-out branch
        if: always()
        run: |
          mkdir -p out
          grep -E "^e: |error:|FAILURE|What went wrong|BUILD SUCCESSFUL|BUILD FAILED|Unresolved|Could not" build.log > out/errors.txt || true
          tail -n 400 build.log > out/build-tail.log || true
          cp app/build/outputs/apk/release/*.apk out/lumen.apk 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > out/status.txt
          cd out
          git init -q
          git checkout -q -b ci-out
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-out

      - name: Publish OTA update to Supabase
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FN: https://mplorochmulzbxyiihdq.supabase.co/functions/v1/lumen-publish
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          CODE=$(grep -Eo 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -Eo '[0-9]+')
          NAME=$(grep -Eo 'versionName *= *"[^"]+"' app/build.gradle.kts | sed -E 's/.*"(.*)"/\1/')
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES=$(git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          # Подпись GitHub (OIDC) вместо хранимых секретов.
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lumen-ota" | jq -r .value)
          SIGN=$(jq -n --argjson c "$CODE" '{stage:"sign", version_code:$c}' | curl -sS -X POST "$FN" -H "x-github-oidc: $OIDC" -H "Content-Type: application/json" --data @-)
          echo "$SIGN" | jq -r '.path // .error'
          URL=$(echo "$SIGN" | jq -r .signed_url)
          curl -sS --fail -X PUT "$URL" -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" --data-binary @"$APK" > /dev/null
          jq -n --argjson c "$CODE" --arg n "$NAME" --arg notes "$NOTES" --argjson s "$SIZE" --arg sha "$SHA" \
            '{stage:"commit", version_code:$c, version_name:$n, notes:$notes, size_bytes:$s, sha256:$sha}' \
            | curl -sS --fail -X POST "$FN" -H "x-github-oidc: $OIDC" -H "Content-Type: application/json" --data @-
          echo "OTA: опубликована $NAME ($CODE)" | tee -a ota.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lumen-apk
          path: app/build/outputs/apk/release/*.apk
